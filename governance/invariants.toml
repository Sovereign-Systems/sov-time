[[invariant]]
id = "INV-TIME-002"
name = "CHECKED_TIME_ARITHMETIC"
owner = "domain.time"
statement = "Time arithmetic never wraps, saturates, panics, or silently substitutes a value on overflow or underflow."
verification = ["OVERFLOW_UNDERFLOW_NEGATIVE_TEST", "PROPERTY_ARITHMETIC_REFERENCE"]

[[invariant]]
id = "INV-TASK-001"
